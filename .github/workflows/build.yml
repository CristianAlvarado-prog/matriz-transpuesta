name: Compilar macOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyinstaller

      - run: pyinstaller --windowed --name MatrizTranspuesta matriz_transpuesta.py

      - run: ditto -c -k --sequesterRsrc --keepParent dist/MatrizTranspuesta.app dist/MatrizTranspuesta-macOS-AppleSilicon.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MatrizTranspuesta-macOS-AppleSilicon
          path: dist/MatrizTranspuesta-macOS-AppleSilicon.zip
